services:
  mongo:
    container_name: mongo
    image: mongo:7.0.40
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: s3cr3t
    volumes:
      - mongo-data:/data/db
    networks:
      - dev-network

volumes:
  mongo-data:

networks:
  dev-network:
    external: true
